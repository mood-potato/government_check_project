<nav class="bg-white shadow-md">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <a href="/" class="flex items-center space-x-2">
                <span class="text-2xl">🏛️</span>
                <span class="font-bold text-lg text-gray-800">국회 회의록 분석</span>
            </a>

            <!-- Navigation Links -->
            <div class="hidden md:flex space-x-8">
                <a href="/"
                   class="text-gray-600 hover:text-blue-600 transition-colors
                          {% if request.url.path == '/' %}text-blue-600 font-medium{% endif %}">
                    홈
                </a>
                <a href="/meetings"
                   class="text-gray-600 hover:text-blue-600 transition-colors
                          {% if '/meetings' in request.url.path %}text-blue-600 font-medium{% endif %}">
                    회의 목록
                </a>
                <a href="/speakers"
                   class="text-gray-600 hover:text-blue-600 transition-colors
                          {% if '/speakers' in request.url.path %}text-blue-600 font-medium{% endif %}">
                    의원 검색
                </a>
                <a href="/search"
                   class="text-gray-600 hover:text-blue-600 transition-colors
                          {% if '/search' in request.url.path %}text-blue-600 font-medium{% endif %}">
                    발언 검색
                </a>
            </div>

            <!-- Mobile menu button -->
            <button class="md:hidden" onclick="toggleMobileMenu()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden pb-4">
            <a href="/" class="block py-2 text-gray-600 hover:text-blue-600">홈</a>
            <a href="/meetings" class="block py-2 text-gray-600 hover:text-blue-600">회의 목록</a>
            <a href="/speakers" class="block py-2 text-gray-600 hover:text-blue-600">의원 검색</a>
            <a href="/search" class="block py-2 text-gray-600 hover:text-blue-600">발언 검색</a>
        </div>
    </div>
</nav>

<script>
function toggleMobileMenu() {
    document.getElementById('mobile-menu').classList.toggle('hidden');
}
</script>
